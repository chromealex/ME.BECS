<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BECS Remote Debug</title>
<style>
:root{color-scheme:dark;--bg:#202226;--surface:#292c31;--text:#e8eaf0;--muted:#aab3c1;--border:#3c424c;--button:#14171b;--hover:#1b2027;--accent:#7196ff;--selection:#395f85;--track:#3a404a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px/1.5 system-ui}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}h1{font-size:13px;font-weight:500;margin:0 12px 0 0}h2{font-size:13px;font-weight:500;margin:0 0 14px}button,input{font:inherit;background:var(--button);color:inherit;border:1px solid var(--border);border-radius:4px;min-height:28px;padding:4px 12px}button{cursor:pointer}button:hover{background:var(--hover)}button.active,button[aria-pressed=true]{background:var(--selection);color:#fff;border-bottom:2px solid var(--accent)}button:disabled{opacity:.45;cursor:default}nav{padding:8px 12px;display:flex;gap:4px;flex-wrap:wrap}main{padding:24px}section{margin-bottom:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-weight:400;overflow-wrap:anywhere}th,small{color:var(--muted)}#status{margin-left:auto;font-size:11px;color:var(--muted)}pre{white-space:pre-wrap}.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.card{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:6px;flex:1 1 170px}.card h2{font-size:25px;margin:6px 0;font-variant-numeric:tabular-nums}.tree{font:12px/1.8 monospace}.tree>div{padding:3px 8px}.tree>div:hover{background:var(--surface)}#world-tabs{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;min-height:32px;padding:3px 12px 0;background:var(--surface);border-bottom:1px solid var(--border)}.world-tab{display:flex}.world-tab button{border-radius:4px 4px 0 0;height:28px;padding:0 12px}.world-tab .close{padding:0 7px;border-left:0}#add-world{width:28px;padding:0;margin-bottom:2px}#world-menu{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}#world-menu button{margin:4px}.top-line{height:1px;background:linear-gradient(90deg,var(--bg),var(--accent))}[hidden]{display:none!important}@media(max-width:480px){main{padding:16px}.card{flex-basis:100%}}@media(pointer:coarse){button{min-height:44px}.world-tab button{height:auto}input{font-size:16px}}

#world-rail{position:relative}.world-tab{align-items:center;background:var(--button);border:1px solid var(--border);border-radius:4px 4px 0 0}.world-tab:has(button[aria-pressed=true]){background:var(--selection);border-bottom:2px solid var(--accent)}.world-tab button,.world-tab button[aria-pressed=true]{background:transparent;border:0;height:26px;min-height:26px}.world-tab .close{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;text-align:center;font-size:11px;line-height:1;width:18px;height:18px;min-height:18px;padding:0;margin:0 4px 0 0;border:0;border-radius:3px;color:var(--muted)}.world-tab:has(button[aria-pressed=true]) .close{color:#fff}.world-tab .close:hover{background:var(--hover)}#world-menu{position:absolute;z-index:20;width:250px;max-width:calc(100% - 16px);padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:0 6px 18px #0004}#world-menu button{display:block;width:100%;margin:0;padding:7px 10px;text-align:left;border:0;border-radius:2px;background:transparent}#world-menu button:hover,#world-menu button:focus-visible{background:var(--selection);color:#fff}@media(pointer:coarse){.world-tab .close{width:32px;height:44px;min-height:44px}.world-tab button{height:44px;min-height:44px}}

.hierarchy-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px}.hierarchy-search{display:block;margin-bottom:12px}.hierarchy-search input{display:block;width:100%;margin-top:6px;background:var(--surface)}.entity-row{display:block;width:100%;border:0;border-radius:0;background:transparent;text-align:left;overflow-wrap:anywhere}.entity-row[aria-pressed=true]{border:0;background:var(--selection)}.hierarchy-count{display:block;margin:8px 0;color:var(--muted)}.entity-inspector{min-width:0}.entity-inspector h2{overflow-wrap:anywhere}.component{margin-bottom:12px}.component summary{padding:8px;background:var(--surface);overflow-wrap:anywhere;cursor:pointer}.component dl{margin:0}.component .field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:5px 8px}.component dt,.component dd{margin:0;overflow-wrap:anywhere}.component dt{color:var(--muted)}.component dd{font-family:monospace}.inspector-error{color:#e5bf57;overflow-wrap:anywhere;padding:8px}@media(max-width:640px){.hierarchy-layout{grid-template-columns:1fr}}

.hierarchy-item{display:flex;align-items:center;min-width:0}.hierarchy-item .entity-row{flex:1;min-width:0}.tree-toggle{font-size:20px;line-height:1;flex:0 0 28px;width:28px;min-height:24px;padding:0;background:transparent;border:0;border-radius:0}.tree-spacer{flex:0 0 28px;width:28px}.tree-toggle:disabled{opacity:1;color:var(--muted)}@media(pointer:coarse){.tree-toggle{min-height:44px;flex-basis:32px;width:32px}.tree-spacer{flex-basis:32px;width:32px}}
.world-controls{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.world-controls span{margin:0 8px;color:var(--muted)}
.vector-values{display:flex;gap:12px;flex-wrap:wrap}.vector-axis{display:inline-flex;gap:5px;align-items:baseline}.vector-axis small{font:inherit;color:var(--muted)}.component .vector-field{grid-template-columns:minmax(70px,.6fr) minmax(0,1.4fr)}

html{height:100%}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}body>header,body>nav,#world-rail,.top-line{flex-shrink:0}main{flex:1;min-height:0;overflow:auto}main:has(.hierarchy-layout){overflow:hidden}.hierarchy-layout{height:100%;min-height:0}.hierarchy-layout>section{min-height:0;margin:0;display:flex;flex-direction:column}#hierarchy-rows{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.entity-inspector{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.entity-inspector>.hierarchy-search{position:sticky;top:0;z-index:1;background:var(--bg);padding-bottom:8px;flex-shrink:0}.entity-inspector>.component{flex-shrink:0}*{scrollbar-color:var(--border) var(--bg);scrollbar-width:thin}
.replay-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}.replay-controls label{display:flex;align-items:center;gap:6px}.replay-controls input{width:155px;max-width:100%}.replay-target{color:var(--muted)}.replay-mode{color:#e5bf57}.replay-axis{display:flex;justify-content:space-between;gap:8px;padding-left:68px;color:var(--muted);font-variant-numeric:tabular-nums}.replay-lane{display:flex;align-items:center;gap:12px;margin:8px 0}.replay-lane>span{flex:0 0 56px;color:var(--muted)}.replay-timeline{position:relative;flex:1;min-width:0;height:28px;background:var(--surface);overflow:hidden}.replay-mark{position:absolute;top:7px;width:4px;height:14px;transform:translateX(-50%)}.replay-mark.states{background:#8ad0a0}.replay-mark.local{background:#e5bf57}.replay-mark.remote{background:#bd9add}.replay-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);transform:translateX(-50%)}#replay-slider{display:block;width:calc(100% - 68px);margin-left:68px;padding:0;accent-color:var(--accent)}.replay-note{color:var(--muted);margin:8px 0}.event-local{color:#e5bf57}.event-remote{color:#bd9add}
@media(max-width:640px){.hierarchy-layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:16px}.replay-controls input{width:140px}.replay-axis{font-size:11px}} 
</style>
<header><h1>ME.BECS · Remote Debug</h1><input id="token" type="password" placeholder="App access token" autocomplete="off"><button id="connect">Connect</button><div id="world-controls" class="world-controls" aria-label="World playback" hidden><button id="world-toggle" type="button">Pause</button><span id="world-play-state"></span></div><span id="status">Disconnected</span></header><div class="top-line"></div><div id="world-rail"><div id="world-tabs"></div><div id="world-menu" role="menu" aria-label="Available worlds" hidden></div></div>
<nav id="tool-navigation" hidden><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="hierarchy">Hierarchy</button><button data-tab="replays">Replays</button></nav><main id="content"></main>
<script>
'use strict';
let token='',tab='dashboard',timer,data,busy=false,selectedWorld=-1,openedWorlds=[],snapshotWorld=-1,selectedEntity=null,entityData=null,entityError='',entityRequest=0,hierarchySearch='',expandedBranches=new Set();
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatBytes(value){const bytes=Number(value);if(bytes>=1048576)return (bytes/1048576).toFixed(1)+' MB';if(bytes>=1024)return (bytes/1024).toFixed(1)+' KB';return bytes+' B'}
async function api(path,method='GET'){const r=await fetch(path,{method,headers:{'X-BECS-Token':token},signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error(await r.text());return r.json()}
async function poll(){if(busy)return;busy=true;const requestedWorld=selectedWorld;try{const next=await api('/api/snapshot?world='+encodeURIComponent(requestedWorld));if(requestedWorld!==selectedWorld)return;data=next;snapshotWorld=requestedWorld;openedWorlds=openedWorlds.filter(id=>data.worlds.some(w=>w.id===id));if(selectedWorld!==-1&&!data.worlds.some(w=>w.id===selectedWorld)){selectedWorld=-1;tab='dashboard'}$('status').textContent='Connected · '+new Date().toLocaleTimeString();drawWorldTabs();render();await refreshEntity()}catch(e){$('status').textContent=e.message}finally{busy=false}}
function chooseWorld(id){referenceNavigation++;if(selectedWorld!==id){selectedEntity=null;entityData=null;entityError='';entityRequest++}selectedWorld=id;if(id===-1)tab='dashboard';$('world-menu').hidden=true;drawWorldTabs();render();poll()}
function drawWorldTabs(){if(!data)return;if(selectedWorld===-1)tab='dashboard';$('tool-navigation').hidden=selectedWorld===-1;updateWorldControls();const container=$('world-tabs');container.replaceChildren();function button(text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=action;return b}function addTab(text,id,closable){const wrap=document.createElement('div');wrap.className='world-tab';const pick=button(text,()=>chooseWorld(id));pick.setAttribute('aria-pressed',String(id===selectedWorld));wrap.append(pick);if(closable){const close=button('×',()=>{openedWorlds=openedWorlds.filter(x=>x!==id);if(selectedWorld===id)chooseWorld(-1);else drawWorldTabs()});close.className='close';close.setAttribute('aria-label','Close '+text);wrap.append(close)}container.append(wrap)}addTab('All worlds',-1,false);openedWorlds.forEach(id=>{const w=data.worlds.find(w=>w.id===id);if(w)addTab(w.name+' · #'+w.id,id,true)});const add=button('+',()=>{$('world-menu').hidden=!$('world-menu').hidden;add.setAttribute('aria-expanded',String(!$('world-menu').hidden));positionMenu()});add.id='add-world';add.setAttribute('aria-haspopup','menu');add.setAttribute('aria-controls','world-menu');add.setAttribute('aria-label','Open an existing world');add.setAttribute('aria-expanded',String(!$('world-menu').hidden));container.append(add);const menu=$('world-menu');menu.replaceChildren();const available=data.worlds.filter(w=>!openedWorlds.includes(w.id));available.forEach(w=>menu.append(button(w.name+' · #'+w.id,()=>{openedWorlds.push(w.id);chooseWorld(w.id)})));if(!available.length)menu.textContent=data.worlds.length?'All running worlds are already open':'No running worlds';document.querySelectorAll('[data-tab]').forEach(b=>{b.hidden=selectedWorld===-1&&b.dataset.tab!=='dashboard';b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-pressed',String(b.dataset.tab===tab))});menu.querySelectorAll('button').forEach(b=>b.setAttribute('role','menuitem'));positionMenu()}
$('connect').onclick=()=>{token=$('token').value;clearInterval(timer);poll();timer=setInterval(poll,1000)};

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(selectedWorld===-1)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));drawWorldTabs();render()});
function render(){if(tab==='replays'&&['tick','replay-slider'].includes(document.activeElement?.id))return;if(!data)return;if(selectedWorld===-1){if(!data.worlds.length){$('content').textContent='No running worlds';return}const sum=key=>data.worlds.reduce((v,w)=>v+BigInt(w[key]||0),0n).toString();$('content').innerHTML=`<section><div class="cards">${[['State reserved',formatBytes(sum('reserved'))],['State used',formatBytes(sum('used'))],['State free',formatBytes(sum('free'))],['Entities',sum('entities')]].map(([k,v])=>`<div class="card"><small>${k}</small><h2>${esc(v)}</h2></div>`).join('')}</div><h2>Running worlds</h2><table><tr><th>World</th><th>Tick</th><th>Entities</th></tr>${data.worlds.map(w=>`<tr><td>${esc(w.name)} · #${w.id}</td><td>${esc(w.tick)}</td><td>${w.entities}</td></tr>`).join('')}</table></section>`;return}if(snapshotWorld!==selectedWorld){$('content').textContent='Loading world…';return}const w=data.worlds.find(w=>w.id===selectedWorld);if(!w){$('content').textContent='No running worlds';return}if(tab==='dashboard'){$('content').innerHTML=`<section><h2>${esc(w.name)} · Tick ${esc(w.tick)}</h2><div class="cards">${[['State reserved',formatBytes(w.reserved)],['State used',formatBytes(w.used)],['State free',formatBytes(w.free)],['Entities',w.entities]].map(([k,v])=>`<div class="card"><small>${k}</small><h2>${esc(v)}</h2></div>`).join('')}</div></section>`;return}
if(tab==='hierarchy'){renderHierarchy(w);return}
renderReplays(w)}
function replayBounds(w){let min=BigInt(w.min||0),max=BigInt(w.max||0);if(max<min)max=min;return {min,max}}
function clampReplayTick(value,w){const {min,max}=replayBounds(w);let tick;try{tick=BigInt(value)}catch{tick=min}return (tick<min?min:tick>max?max:tick).toString()}
function replayPercent(value,w){const {min,max}=replayBounds(w);if(max===min)return 0;const tick=BigInt(clampReplayTick(value,w));return Number((tick-min)*1000000n/(max-min))/10000}
function replaySliderTick(value,w){const {min,max}=replayBounds(w);const step=BigInt(Math.max(0,Math.min(1000000,Math.round(Number(value)||0))));return (min+(max-min)*step/1000000n).toString()}
function replayLane(label,values,kind,w,tick){const {min,max}=replayBounds(w);const marks=[...new Set(values)].filter(value=>{const t=BigInt(value);return t>=min&&t<=max});return `<div class="replay-lane"><span>${label}</span><div class="replay-timeline" aria-label="${label} · ${marks.length} ticks">${marks.map(value=>`<span class="replay-mark ${kind}" style="left:${replayPercent(value,w)}%" title="Tick ${esc(value)}"></span>`).join('')}<span class="replay-cursor" style="left:${replayPercent(tick,w)}%"></span></div></div>`}
function renderReplays(w){if(!w.connected){$('content').innerHTML='<section>No connected NetworkModule in selected world</section>';return}const {min,max}=replayBounds(w),tick=clampReplayTick(w.current,w),mid=(min+(max-min)/2n).toString(),events=w.events||[],states=w.states||[];const scroll=$('content').scrollTop;$('content').innerHTML=`<section class="replay-view"><div class="replay-controls"><span class="replay-mode">${w.replay?'Replay · '+esc(w.current):'Live'}</span><button id="live" type="button">Live</button><label>Tick <input id="tick" inputmode="numeric" value="${esc(tick)}" aria-label="Selected replay tick"></label><button id="rewind" type="button">Rewind</button><span class="replay-target">Target ${esc(w.target)}</span></div><div class="replay-axis"><span>${min}</span><span>${mid}</span><span>${max}</span></div>${replayLane('States',states,'states',w,tick)}${replayLane('Local',events.filter(e=>e.local).map(e=>e.tick),'local',w,tick)}${replayLane('Remote',events.filter(e=>!e.local).map(e=>e.tick),'remote',w,tick)}<input id="replay-slider" type="range" min="0" max="1000000" step="1" value="${Math.round(replayPercent(tick,w)*10000)}" aria-label="Selected replay tick" aria-valuetext="${esc(tick)}" ${min===max?'disabled':''}><p class="replay-note">Rewind buffer ${min}–${max} · ${max-min} ticks · Events (up to 2,000)</p><table><thead><tr><th>Source</th><th>Tick</th><th>Player</th><th>Method</th><th>Size</th></tr></thead><tbody>${events.map(e=>`<tr><td class="event-${e.local?'local':'remote'}">${e.local?'Local':'Remote'}</td><td>${esc(e.tick)}</td><td>#${e.player}</td><td>#${e.method}</td><td>${e.bytes} B</td></tr>`).join('')||'<tr><td colspan="5">No stored events</td></tr>'}</tbody></table></section>`;$('content').scrollTop=scroll;const update=t=>{const value=clampReplayTick(t,w);$('tick').value=value;$('replay-slider').value=Math.round(replayPercent(value,w)*10000);$('replay-slider').setAttribute('aria-valuetext',value);$('content').querySelectorAll('.replay-cursor').forEach(c=>c.style.left=replayPercent(value,w)+'%');return value};$('tick').oninput=()=>{if(/^\d+$/.test($('tick').value)){const value=$('tick').value;$('replay-slider').value=Math.round(replayPercent(value,w)*10000);$('content').querySelectorAll('.replay-cursor').forEach(c=>c.style.left=replayPercent(value,w)+'%')}};$('tick').onchange=()=>update($('tick').value);$('rewind').onclick=()=>command('rewind',update($('tick').value));$('live').onclick=()=>command('live','');$('replay-slider').oninput=()=>update(replaySliderTick($('replay-slider').value,w));$('replay-slider').onchange=()=>command('rewind',$('tick').value)}

async function command(action,tick){try{await api(`/api/replay?world=${selectedWorld}&action=${action}&tick=${encodeURIComponent(tick)}`,'POST');await poll()}catch(e){$('status').textContent=e.message}}


function branchKey(world,entity){return world+':'+entity.id+':'+entity.generation}
function matchingHierarchy(entities,query,world,expanded=new Set()){
const q=query.trim().toLowerCase(),byId=new Map(entities.map(e=>[e.id,e])),matches=new Set(entities.filter(e=>!q||(e.name||'').toLowerCase().includes(q)||String(e.id).includes(q.replace(/^#/,''))).map(e=>e.id)),visible=new Set(matches);
for(const id of matches){let e=byId.get(id);const path=new Set();while(e&&e.parentWorld===world&&byId.has(e.parent)&&!path.has(e.id)){path.add(e.id);visible.add(e.parent);e=byId.get(e.parent)}}
const children=new Map(),roots=[];for(const e of entities){if(e.parentWorld===world&&byId.has(e.parent)&&e.parent!==e.id){if(!children.has(e.parent))children.set(e.parent,[]);children.get(e.parent).push(e)}else roots.push(e)}
const rows=[],seen=new Set();function visit(root){const stack=[[root,0,true]];while(stack.length){const [e,depth,shown]=stack.pop();if(seen.has(e.id))continue;seen.add(e.id);const list=children.get(e.id)||[],open=Boolean(q)||expanded.has(branchKey(world,e));if(shown&&visible.has(e.id))rows.push({entity:e,depth,match:matches.has(e.id),children:list.length,expanded:open});for(let i=list.length-1;i>=0;i--)stack.push([list[i],depth+1,shown&&open])}}
roots.forEach(visit);entities.forEach(e=>{if(!seen.has(e.id))visit(e)});return {rows,count:matches.size}}
function renderHierarchy(w){
const treeScroll=$('hierarchy-rows')?.scrollTop||0;const active=document.activeElement,focused=$('hierarchy-rows')?.contains(active)?{id:active.dataset.entity??active.dataset.toggle,generation:active.dataset.generation,toggle:active.dataset.toggle!==undefined}:null;
if(!$('hierarchy-search')){$('content').innerHTML='<div class="hierarchy-layout"><section><label class="hierarchy-search">Search by name or ID<input id="hierarchy-search" type="search" placeholder="Name or #ID" autocomplete="off"></label><span id="hierarchy-count" class="hierarchy-count"></span><div id="hierarchy-rows" role="tree" aria-label="Entity hierarchy"></div></section><section id="entity-inspector" class="entity-inspector" aria-live="polite"></section></div>';$('hierarchy-search').value=hierarchySearch;$('hierarchy-search').oninput=()=>{hierarchySearch=$('hierarchy-search').value;renderHierarchy(w)}}
const liveKeys=new Set(data.entities.map(e=>branchKey(w.id,e)));for(const key of expandedBranches){if(key.startsWith(w.id+':')&&!liveKeys.has(key))expandedBranches.delete(key)}
const {rows,count}=matchingHierarchy(data.entities,hierarchySearch,w.id,expandedBranches);
$('hierarchy-count').textContent=(hierarchySearch.trim()?count+' matches · ':'')+data.entities.length+' entities'+(data.truncated?' · First 10,000':'');
$('hierarchy-rows').innerHTML=rows.map(({entity:e,depth,match,children,expanded})=>{const selected=Boolean(selectedEntity&&selectedEntity.id===e.id&&selectedEntity.generation===e.generation);return `<div class="hierarchy-item" role="treeitem" aria-level="${depth+1}" aria-selected="${selected}" ${children?'aria-expanded="'+expanded+'"':''} style="padding-left:${Math.min(depth,24)*14}px">${children?`<button class="tree-toggle" data-toggle="${e.id}" data-generation="${e.generation}" aria-label="${expanded?'Collapse':'Expand'} ${esc(e.name||'Entity')} (${children} children)" ${hierarchySearch.trim()?'disabled':''}>${expanded?'▾':'▸'}</button>`:'<span class="tree-spacer"></span>'}<button class="entity-row" data-entity="${e.id}" data-generation="${e.generation}" style="${match?'':'color:var(--muted)'}" aria-pressed="${selected}">${esc(e.name||'Entity')} <small>#${e.id} · gen ${e.generation} · v ${e.version}</small></button></div>`}).join('')||'<small>No matching entities</small>';
$('hierarchy-rows').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const entity=data.entities.find(e=>String(e.id)===b.dataset.toggle),key=branchKey(w.id,entity);if(expandedBranches.has(key))expandedBranches.delete(key);else expandedBranches.add(key);renderHierarchy(w)});
$('hierarchy-rows').querySelectorAll('[data-entity]').forEach(b=>b.onclick=()=>selectHierarchyEntity(data.entities.find(e=>String(e.id)===b.dataset.entity),w));
$('hierarchy-rows').onkeydown=event=>{const trigger=event.target.closest('[data-entity],[data-toggle]');if(!trigger)return;const index=rows.findIndex(r=>String(r.entity.id)===(trigger.dataset.entity??trigger.dataset.toggle));const action=hierarchyKeyAction(rows,index,event.key,Boolean(hierarchySearch.trim()));if(!action)return;event.preventDefault();const row=rows[action.index];if(action.branch){const key=branchKey(w.id,row.entity);if(action.branch==='expand')expandedBranches.add(key);else expandedBranches.delete(key)}selectHierarchyEntity(row.entity,w);$('hierarchy-rows')?.querySelector(`[data-entity="${row.entity.id}"]`)?.scrollIntoView({block:'nearest'})};
$('hierarchy-rows').scrollTop=treeScroll;renderInspector();if(focused){const button=$('hierarchy-rows').querySelector(`[${focused.toggle?'data-toggle':'data-entity'}="${focused.id}"][data-generation="${focused.generation}"]`);button?.focus({preventScroll:true})}}
function selectHierarchyEntity(entity,world){referenceNavigation++;if(!entity)return;if(selectedEntity?.id!==entity.id||selectedEntity?.generation!==entity.generation){selectedEntity=entity;entityData=null;entityError=''}renderHierarchy(world);$('hierarchy-rows')?.querySelector(`[data-entity="${entity.id}"]`)?.focus({preventScroll:true});refreshEntity()}
function hierarchyKeyAction(rows,index,key,searching=false){if(index<0||!rows[index])return null;const row=rows[index];if(key==='ArrowDown')return {index:Math.min(rows.length-1,index+1)};if(key==='ArrowUp')return {index:Math.max(0,index-1)};if(key==='Home')return {index:0};if(key==='End')return {index:rows.length-1};if(key==='ArrowRight'){if(row.children&&!row.expanded&&!searching)return {index,branch:'expand'};if(rows[index+1]?.depth>row.depth)return {index:index+1};return {index}}if(key==='ArrowLeft'){if(row.children&&row.expanded&&!searching)return {index,branch:'collapse'};for(let parent=index-1;parent>=0;parent--)if(rows[parent].depth<row.depth)return {index:parent};return {index}}return null}
async function refreshEntity(){if(tab!=='hierarchy'||!selectedEntity||selectedWorld<0)return;const entity=selectedEntity,world=selectedWorld,serial=++entityRequest;try{const detail=await api(`/api/entity?world=${world}&entity=${entity.id}&generation=${entity.generation}`);if(serial!==entityRequest||world!==selectedWorld||selectedEntity!==entity)return;entityData=detail;entityError='';renderInspector()}catch(e){if(serial===entityRequest&&world===selectedWorld&&selectedEntity===entity){entityError=e.message;renderInspector()}}}

function componentCaption(name){return String(name).split(/[.+]/).pop().replace(/Component$/,'')}
function inlineFields(fields){const vectors=new Map();for(const field of fields){const match=/^(.*)\.([xyzw])$/.exec(field.name);if(match){if(!vectors.has(match[1]))vectors.set(match[1],new Map());vectors.get(match[1]).set(match[2],field)}}const emitted=new Set(),result=[];for(const field of fields){const match=/^(.*)\.([xyzw])$/.exec(field.name),axes=match&&vectors.get(match[1]);if(axes&&axes.has('x')&&axes.has('y')){if(!emitted.has(match[1])){emitted.add(match[1]);result.push({name:match[1],axes:['x','y','z','w'].filter(axis=>axes.has(axis)).map(axis=>({axis,value:axes.get(axis).value}))})}}else result.push(field)}return result}
let inspectorOwner='',referenceNavigation=0,componentSearch='';
async function navigateReference(f){const serial=++referenceNavigation;try{const detail=await api(`/api/entity?world=${f.entityWorld}&entity=${f.entityId}&generation=${f.entityGeneration}`);if(serial!==referenceNavigation)return;if(!detail.alive)throw Error('Referenced entity no longer exists');const snapshot=await api('/api/snapshot?world='+f.entityWorld);if(serial!==referenceNavigation)return;if(!snapshot.worlds.some(w=>w.id===f.entityWorld))throw Error('Referenced world no longer exists');if(!openedWorlds.includes(f.entityWorld))openedWorlds.push(f.entityWorld);entityRequest++;selectedWorld=f.entityWorld;tab='hierarchy';data=snapshot;snapshotWorld=selectedWorld;hierarchySearch='';selectedEntity=snapshot.entities.find(e=>e.id===f.entityId&&e.generation===f.entityGeneration)||{id:f.entityId,generation:f.entityGeneration,name:detail.name};entityData=detail;entityError='';let current=selectedEntity;const seen=new Set();while(current&&!seen.has(current.id)){seen.add(current.id);expandedBranches.add(branchKey(selectedWorld,current));current=current.parentWorld===selectedWorld?snapshot.entities.find(e=>e.id===current.parent):null}drawWorldTabs();render();$('hierarchy-rows')?.querySelector(`[data-entity="${f.entityId}"]`)?.scrollIntoView({block:'nearest'})}catch(e){if(serial===referenceNavigation)$('status').textContent=e.message}}
function bindReferences(panel){panel.querySelectorAll('[data-reference]').forEach(row=>{const f=JSON.parse(row.dataset.reference);row.querySelector('[data-go]').onclick=()=>navigateReference(f)})}
function renderFields(fields){return inlineFields(fields).map(f=>f.axes?`<div class="field vector-field"><dt>${esc(f.name)}</dt><dd class="vector-values">${f.axes.map(v=>`<span class="vector-axis"><small>${v.axis.toUpperCase()}</small><span>${esc(v.value)}</span></span>`).join('')}</dd></div>`:f.entityReference?`<div class="field entity-reference" data-reference="${esc(JSON.stringify(f))}"><dt>${esc(f.name)}</dt><dd><span>${esc(f.value)}</span> <button type="button" data-go>Select</button></dd></div>`:`<div class="field"><dt>${esc(f.name)}</dt><dd>${esc(f.value)}</dd></div>`).join('')}

function renderInspector(){const inspectorScroll=$('entity-inspector')?.scrollTop||0;const previousOwner=inspectorOwner;const owner=selectedWorld+':'+selectedEntity?.id+':'+selectedEntity?.generation;if(owner!==inspectorOwner){inspectorOwner=owner;componentSearch=''}const panel=$('entity-inspector');if(!panel)return;if(!selectedEntity){panel.innerHTML='<small>Select an entity to inspect its components</small>';return}if(entityError){panel.innerHTML='<p class="inspector-error">'+esc(entityError)+'</p>';return}if(!entityData){panel.innerHTML='<small>Loading components…</small>';return}if(!entityData.alive){panel.innerHTML='<small>Entity no longer exists (or its ID was reused)</small>';return}const searchFocused=document.activeElement?.id==='component-search',caret=document.activeElement?.selectionStart;const query=componentSearch.trim().toLowerCase();const components=entityData.components.filter(c=>!query||componentCaption(c.name).toLowerCase().includes(query)||c.fields.some(f=>(f.name+' '+f.value).toLowerCase().includes(query)));const closed=new Set([...panel.querySelectorAll('details:not([open])')].map(d=>d.dataset.component));panel.innerHTML=`<label class="hierarchy-search">Search components and fields<input id="component-search" type="search" placeholder="Component, field or value" value="${esc(componentSearch)}" autocomplete="off"></label><h2 style="margin-top:18px">Components · ${entityData.components.length}</h2>${entityData.staticError?'<p class="inspector-error">'+esc(entityData.staticError)+'</p>':''}${components.map(c=>{const key=c.kind+':'+c.name;return `<details class="component" data-component="${esc(key)}" ${closed.has(key)?'':'open'}><summary>${esc(componentCaption(c.name))} <small>${c.kind==='Component'?'':esc(c.kind)}${c.tag?' · Tag':''}${c.enabled?'':' · Disabled'}</small></summary>${c.error?'<p class="inspector-error">'+esc(c.error)+'</p>':c.tag?'<small>Tag · no data fields</small>':'<dl>'+renderFields(c.fields)+'</dl>'}</details>`}).join('')}${entityData.truncated?'<small>Component limit reached (256)</small>':''}`;panel.scrollTop=previousOwner===owner?inspectorScroll:0;bindReferences(panel);$('component-search').oninput=event=>{componentSearch=event.target.value;renderInspector()};if(searchFocused){$('component-search').focus({preventScroll:true});try{$('component-search').setSelectionRange(caret,caret)}catch{}}}


function updateWorldControls(){const world=data?.worlds.find(w=>w.id===selectedWorld),button=$('world-toggle');$('world-controls').hidden=!world||selectedWorld===-1;button.textContent=world?.paused?'Play':'Pause';button.disabled=world?.paused?!world.canPlay:!world?.canPause;button.setAttribute('aria-label',world?.paused?'Resume selected world':'Pause selected world');$('world-play-state').textContent=world?.paused?'Paused':world?.canPause?'Running':'Control unavailable'}
async function worldCommand(action){const world=selectedWorld;if(world<0)return;$('world-toggle').disabled=true;try{await api(`/api/world?world=${world}&action=${action}`,'POST');await poll()}catch(e){$('status').textContent=e.message;updateWorldControls()}}
$('world-toggle').onclick=()=>{const world=data?.worlds.find(w=>w.id===selectedWorld);if(world)worldCommand(world.paused?'play':'pause')};

function positionMenu(){const menu=$('world-menu'),add=$('add-world'),rail=$('world-rail');if(menu.hidden||!add)return;menu.style.left=Math.max(8,Math.min(add.offsetLeft,rail.clientWidth-menu.offsetWidth-8))+'px';menu.style.top=(add.offsetTop+add.offsetHeight+4)+'px'}
function closeMenu(){$('world-menu').hidden=true;$('add-world')?.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{if(!e.target.closest('#world-menu')&&!e.target.closest('#add-world'))closeMenu()});
document.addEventListener('keydown',e=>{const menu=$('world-menu'),add=$('add-world');if(e.key==='Escape'&&!menu.hidden){closeMenu();add?.focus();e.preventDefault()}else if(e.target===add&&e.key==='ArrowDown'){menu.hidden=false;add.setAttribute('aria-expanded','true');positionMenu();menu.querySelector('button')?.focus();e.preventDefault()}else if(menu.contains(e.target)&&['ArrowDown','ArrowUp'].includes(e.key)){const items=[...menu.querySelectorAll('button')];items[(items.indexOf(e.target)+(e.key==='ArrowDown'?1:items.length-1))%items.length]?.focus();e.preventDefault()}});
window.addEventListener('resize',positionMenu);
const linkToken=new URLSearchParams(location.hash.slice(1)).get('token');
if(linkToken){$('token').value=linkToken;history.replaceState(null,'',location.pathname+location.search);$('connect').click()}
</script></html>
